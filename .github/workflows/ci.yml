name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production route smoke test
        run: npm run test:smoke
      - name: Update origin tests
        run: PYTHONPATH=services/update-origin/src python3 -m unittest discover -s services/update-origin/tests -v
      - name: Install Nginx syntax-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
      - name: Validate update-origin Nginx configuration
        run: services/update-origin/tests/check-nginx.sh
      - name: Update-origin HTTPS transport regression tests (isolated loopback)
        env:
          HOMECLOUD_ORIGIN_NGINX_INTEGRATION: "1"
        run: PYTHONPATH=services/update-origin/src python3 -m unittest discover -s services/update-origin/tests -p test_nginx_origin.py -v

  debian-origin:
    name: Update origin / Debian ${{ matrix.debian }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    container: debian:${{ matrix.debian }}-slim
    steps:
      - name: Install test dependencies in disposable container only
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git nginx openssl python3 util-linux
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render and validate as unprivileged user
        run: runuser -u nobody -- services/update-origin/tests/check-nginx.sh
      - name: Signed HTTPS transport tests as unprivileged user
        run: >-
          runuser -u nobody -- env CI=true HOMECLOUD_ORIGIN_NGINX_INTEGRATION=1
          PYTHONPATH=services/update-origin/src python3 -m unittest discover
          -s services/update-origin/tests -p test_nginx_origin.py -v
